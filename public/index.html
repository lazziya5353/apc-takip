<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APC Kargo Takip</title>
<style>
  :root {
    --bg: #eceef7; --card: #ffffff; --text: #191b2a; --muted: #5d6279; --line: #e0e3ee;
    --accent: #2b2e7d; --accent-text: #ffffff; --link: #2b2e7d;
    --hero-from: #1f2260; --hero-to: #4b50d1;
    --ok: #0b6b3d; --ok-bg: #d9f3e5; --warn: #864c00; --warn-bg: #ffeccb;
    --bad: #b0211a; --bad-bg: #fddcd9; --info: #17559f; --info-bg: #dcebfb;
    --neutral: #5d6279; --neutral-bg: #e9ebf3;
    --shadow: 0 1px 2px rgba(20, 22, 50, .06), 0 10px 28px rgba(20, 22, 50, .09);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1018; --card: #1a1c28; --text: #eceef7; --muted: #9ba0b8; --line: #2b2e40;
      --accent: #959aff; --accent-text: #10111a; --link: #a9adff;
      --hero-from: #14164a; --hero-to: #2f33a0;
      --ok: #62d79c; --ok-bg: #15372a; --warn: #f4bb52; --warn-bg: #3b2e12;
      --bad: #ff8b82; --bad-bg: #46201d; --info: #84b9f6; --info-bg: #162a42;
      --neutral: #9ba0b8; --neutral-bg: #262939;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  .hero { background: linear-gradient(135deg, var(--hero-from), var(--hero-to)); color: #fff; padding: 28px 0 64px; }
  .hero h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; }
  .hero p { margin: 0; opacity: .85; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; margin-top: -40px; padding-bottom: 64px; align-items: start; }
  .col-side { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .col-side { position: static; max-height: none; }
  }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
  textarea { width: 100%; min-height: 104px; resize: vertical; padding: 12px; border-radius: 10px;
             border: 1px solid var(--line); background: var(--bg); color: var(--text);
             font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 16px; border-radius: 9px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .55; cursor: default; }
  button.mini { padding: 2px 10px; font-size: 13px; border-radius: 7px; }
  .hint { color: var(--muted); font-size: 13px; }
  #notice { margin: 14px 2px 0; color: var(--muted); min-height: 1.5em; }
  #notice.err { color: var(--bad); font-weight: 600; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .meta { color: var(--muted); }

  /* Sonuç kartları: durum rengi sol kenarda ve üstte şeritte */
  .v-delayed, .v-returned { --vc: var(--bad); --vbg: var(--bad-bg); }
  .v-attention { --vc: var(--warn); --vbg: var(--warn-bg); }
  .v-delivered { --vc: var(--ok); --vbg: var(--ok-bg); }
  .v-ontrack { --vc: var(--info); --vbg: var(--info-bg); }
  .v-unknown { --vc: var(--neutral); --vbg: var(--neutral-bg); }
  .result { margin-top: 16px; padding: 0; overflow: hidden; border-left: 6px solid var(--vc); }
  .banner { display: flex; gap: 14px; align-items: center; padding: 14px 18px; background: var(--vbg); color: var(--vc); }
  .banner .icon { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--vc); color: var(--card);
                  display: grid; place-items: center; font-size: 20px; font-weight: 800; }
  .banner .big { font-size: 22px; font-weight: 800; line-height: 1.2; }
  .banner .small { font-size: 14px; opacity: .9; margin-top: 2px; }
  .body { padding: 16px 18px 18px; }
  .head { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
  .pkg { font: 700 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .b-ok { background: var(--ok-bg); color: var(--ok); }
  .b-warn { background: var(--warn-bg); color: var(--warn); }
  .b-bad { background: var(--bad-bg); color: var(--bad); }
  .b-info { background: var(--info-bg); color: var(--info); }
  .b-neutral { background: var(--neutral-bg); color: var(--neutral); }
  ul.points { list-style: none; margin: 12px 0 0; padding: 0; }
  ul.points li { display: flex; gap: 10px; padding: 4px 0; }
  .mark { flex: none; width: 20px; height: 20px; border-radius: 50%; text-align: center;
          font-size: 12px; line-height: 20px; font-weight: 800; margin-top: 2px; }
  .last { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
  .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  h2.sec { margin: 16px 0 0; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 5px 18px; margin: 8px 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; word-break: break-word; }
  a { color: var(--link); }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--link); font-weight: 600; }
  ol { list-style: none; margin: 10px 0 0; padding: 0; }
  li.ev { padding: 8px 0 8px 14px; border-left: 2px solid var(--line); }
  li.ev:first-child { border-left-color: var(--vc); }
  .ev .t { color: var(--muted); font-size: 13px; }
  .foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .actions { margin-top: 16px; display: none; }
  @media (max-width: 520px) { dl { grid-template-columns: 1fr; } dt { margin-top: 6px; } }

  /* Geçmiş kontroller */
  .col-side h2 { margin: 0; font-size: 17px; }
  .hist-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .hist-tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; }
  ul.hist { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
  .h-item { border: 1px solid var(--line); border-left: 5px solid var(--vc); border-radius: 10px; background: var(--card); }
  .h-item.active { outline: 2px solid var(--accent); }
  .h-main { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 12px 6px; border-radius: 10px; }
  .h-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .h-line { display: block; margin-top: 4px; font-weight: 800; color: var(--vc); }
  .h-meta { display: block; margin-top: 2px; font-size: 12.5px; color: var(--muted); }
  .h-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 4px 12px 10px; }
  .new { font-size: 12px; font-weight: 800; color: var(--accent-text); background: var(--accent); padding: 1px 8px; border-radius: 999px; }
  .h-err { font-size: 12.5px; color: var(--bad); }
  #histEmpty { margin: 12px 0 0; color: var(--muted); }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <h1>APC Kargo Takip</h1>
    <p>APC linkini ya da takip numarasını yapıştır, durum özetini ve local carrier bilgisini getireyim.</p>
  </div>
</header>

<main class="wrap grid">
  <section class="col-main">
    <div class="panel">
      <label for="input" class="hint">Her satıra bir link veya numara (en fazla 50)</label>
      <textarea id="input" spellcheck="false" placeholder="https://tracking.apc-pli.com/18391P1008260002682920&#10;18391P1012260002728838"></textarea>
      <div class="row">
        <button id="go" class="primary" type="button">Sorgula</button>
        <button id="clear" type="button">Temizle</button>
        <span class="hint">Ctrl + Enter ile de sorgulayabilirsin.</span>
      </div>
    </div>

    <p id="notice" role="status" aria-live="polite"></p>
    <div id="results"></div>
    <div class="actions" id="actions">
      <button id="copy" type="button">Özeti kopyala</button>
    </div>
  </section>

  <aside class="col-side">
    <div class="panel">
      <div class="hist-head">
        <h2>Geçmiş kontroller</h2>
        <span class="hint" id="histCount"></span>
      </div>
      <div class="hist-tools">
        <button id="recheckAll" type="button">Hepsini tekrar kontrol et</button>
        <button id="clearHist" class="danger" type="button">Geçmişi temizle</button>
      </div>
      <div class="chips" id="histStats"></div>
      <ul class="hist" id="histList"></ul>
      <p id="histEmpty">Henüz kontrol yok. Sorguladığın kargolar burada durur.</p>
      <p class="hint" id="histNote"></p>
    </div>
  </aside>
</main>

<script>
(function () {
  'use strict';
  var STORE_KEY = 'apc-takip-gecmis-v1';
  var MAX_HISTORY = 60;
  var $ = function (id) { return document.getElementById(id); };
  var fmt = new Intl.DateTimeFormat('tr-TR', {
    dateStyle: 'medium', timeStyle: 'short', timeZone: 'Europe/Istanbul'
  });
  var fmtDay = new Intl.DateTimeFormat('tr-TR', { dateStyle: 'medium', timeZone: 'Europe/Istanbul' });

  function when(iso) {
    if (!iso) return '-';
    var d = new Date(iso);
    return isNaN(d) ? '-' : fmt.format(d);
  }
  function day(iso) {
    if (!iso) return '-';
    var d = new Date(iso);
    return isNaN(d) ? '-' : fmtDay.format(d);
  }
  // Dış kaynaklı metinler her zaman textContent ile yazılır, HTML olarak asla.
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function safeUrl(u) {
    try {
      var p = new URL(u);
      return p.protocol === 'https:' || p.protocol === 'http:' ? p.href : null;
    } catch (e) { return null; }
  }
  function setNotice(text, isErr) {
    var n = $('notice');
    n.textContent = text || '';
    n.className = isErr ? 'err' : '';
  }

  var VERDICTS = {
    delivered: ['Teslim edildi', 'b-ok'],
    returned: ['İade', 'b-bad'],
    delayed: ['Gecikme var', 'b-bad'],
    attention: ['Dikkat', 'b-warn'],
    ontrack: ['Yolunda', 'b-info'],
    unknown: ['Bilinmiyor', 'b-neutral']
  };
  var ICONS = { delivered: '✓', returned: '↩', delayed: '!', attention: '!', ontrack: '→', unknown: '?' };
  // Renk tek başına anlam taşımasın diye her seviyenin bir simgesi de var.
  var MARKS = { ok: ['✓', 'b-ok'], info: ['i', 'b-info'], warn: ['!', 'b-warn'], bad: ['✕', 'b-bad'] };

  function verdictOf(r) { return r && r.analysis && VERDICTS[r.analysis.verdict] ? r.analysis.verdict : 'unknown'; }

  // Kısa uyarı metni: kaç gün gecikmiş, kaç gündür hareket yok, iade vb.
  function alertText(r) {
    var an = r.analysis;
    if (an.delayDays > 0) return an.delayDays + ' gün gecikmiş';
    if (an.flags && an.flags.stalled && r.last && r.last.time) {
      var days = Math.floor((Date.now() - Date.parse(r.last.time)) / 864e5);
      return days + ' gündür hareket yok';
    }
    if (an.verdict === 'returned') return 'İade kaydı var';
    return an.headline;
  }

  // ---------- Geçmiş kontroller (bu tarayıcıda saklanır) ----------
  var history = [];
  var storageOk = true;
  var busy = {};
  var view = { type: 'none', key: null, items: [] };

  function isEntry(e) {
    return e && typeof e.key === 'string' && typeof e.queryId === 'string' && e.result && e.result.ok === true;
  }
  function loadHistory() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      history = Array.isArray(arr) ? arr.filter(isEntry) : [];
    } catch (e) { history = []; storageOk = false; }
  }
  function saveHistory() {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(history)); }
    catch (e) { storageOk = false; }
  }
  function findEntry(key) {
    for (var i = 0; i < history.length; i++) if (history[i].key === key) return history[i];
    return null;
  }
  function keyOf(r) { return r.packageNumber || r.id; }
  function sig(r) { return r && r.last ? r.last.time + '|' + r.last.description : ''; }

  // Yeni sorgu: kayıt en üste taşınır. Daha önce varsa "yeni hareket" işareti sıfırlanır.
  function addToHistory(r, checkedAt) {
    var key = keyOf(r);
    var old = findEntry(key);
    if (old) history.splice(history.indexOf(old), 1);
    var entry = { key: key, queryId: r.id, checkedAt: checkedAt, changed: false, error: null, result: r };
    history.unshift(entry);
    if (history.length > MAX_HISTORY) history.length = MAX_HISTORY;
    return entry;
  }

  // Tekrar kontrolde yeri değişmez, son hareket değiştiyse "yeni hareket" işareti konur.
  function applyResult(e, r, checkedAt) {
    if (r && r.ok) {
      if (sig(e.result) !== sig(r)) e.changed = true;
      e.result = r;
      e.checkedAt = checkedAt;
      e.error = null;
    } else {
      e.error = (r && r.error) || 'Kontrol edilemedi.';
    }
  }

  async function lookup(text) {
    var res = await fetch('/api/lookup', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text: text })
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Bir hata oluştu.');
    return data;
  }

  async function recheck(key) {
    var e = findEntry(key);
    if (!e || busy[key]) return;
    busy[key] = true;
    renderHistory();
    refreshMain();
    try {
      var data = await lookup(e.queryId);
      applyResult(e, data.results[0], data.checkedAt);
    } catch (err) {
      e.error = err.message || 'Sunucuya ulaşılamadı.';
    }
    delete busy[key];
    saveHistory();
    renderHistory();
    refreshMain();
  }

  async function recheckAll() {
    if (!history.length) return;
    var entries = history.slice();
    entries.forEach(function (e) { busy[e.key] = true; });
    $('recheckAll').disabled = true;
    renderHistory();
    refreshMain();
    setNotice(entries.length + ' kargo tekrar kontrol ediliyor…');
    try {
      for (var i = 0; i < entries.length; i += 50) {
        var chunk = entries.slice(i, i + 50);
        try {
          var data = await lookup(chunk.map(function (e) { return e.queryId; }).join('\n'));
          chunk.forEach(function (e) {
            var r = data.results.filter(function (x) { return x.id === e.queryId; })[0];
            if (r) applyResult(e, r, data.checkedAt); else e.error = 'Sonuç alınamadı.';
          });
        } catch (err) {
          chunk.forEach(function (e) { e.error = err.message || 'Sunucuya ulaşılamadı.'; });
        }
      }
    } finally {
      entries.forEach(function (e) { delete busy[e.key]; });
      $('recheckAll').disabled = false;
      saveHistory();
      renderHistory();
      refreshMain();
      var changed = entries.filter(function (e) { return e.changed; }).length;
      var failed = entries.filter(function (e) { return e.error; }).length;
      var parts = ['Tekrar kontrol tamamlandı'];
      if (changed) parts.push(changed + ' kargoda yeni hareket var');
      if (failed) parts.push(failed + ' kargo kontrol edilemedi');
      setNotice(parts.join(' · '), failed > 0 && failed === entries.length);
    }
  }

  function clearHistory() {
    if (!history.length) return;
    if (!window.confirm('Tüm geçmiş kontroller silinsin mi? Bu işlem geri alınamaz.')) return;
    history = [];
    saveHistory();
    if (view.type === 'entry') clearMain();
    renderHistory();
    refreshMain();
    setNotice('Geçmiş temizlendi.');
  }

  // ---------- Kart çizimi ----------
  function render(r, opts) {
    opts = opts || {};
    var verdict = verdictOf(r);
    var card = el('section', 'panel result v-' + verdict);

    if (!r.ok) {
      var eb = el('div', 'banner');
      eb.appendChild(el('span', 'icon', '?'));
      var et = el('div');
      et.appendChild(el('div', 'big', 'Sorgulanamadı'));
      et.appendChild(el('div', 'small', r.id + ': ' + r.error));
      eb.appendChild(et);
      card.appendChild(eb);
      return card;
    }

    var an = r.analysis;
    var v = VERDICTS[verdict];

    // Belirgin uyarı şeridi
    var banner = el('div', 'banner');
    banner.appendChild(el('span', 'icon', ICONS[verdict]));
    var bt = el('div');
    if (an.delayDays > 0) {
      bt.appendChild(el('div', 'big', an.delayDays + ' gün gecikmiş'));
      bt.appendChild(el('div', 'small', an.headline));
    } else {
      bt.appendChild(el('div', 'big', an.headline));
    }
    banner.appendChild(bt);
    card.appendChild(banner);

    var body = el('div', 'body');
    var head = el('div', 'head');
    head.appendChild(el('span', 'pkg', r.packageNumber || r.id));
    head.appendChild(el('span', 'badge ' + v[1], v[0]));
    body.appendChild(head);

    if (an.points.length) {
      var ul = el('ul', 'points');
      an.points.forEach(function (p) {
        var li = el('li');
        var m = MARKS[p.level] || MARKS.info;
        li.appendChild(el('span', 'mark ' + m[1], m[0]));
        li.appendChild(el('span', null, p.text));
        ul.appendChild(li);
      });
      body.appendChild(ul);
    }

    if (r.last) {
      var last = el('div', 'last');
      last.appendChild(el('div', 'label', 'Son hareket'));
      last.appendChild(el('strong', null, r.last.description));
      last.appendChild(document.createElement('br'));
      var loc = r.last.location ? ' · ' + r.last.location : '';
      last.appendChild(el('span', 'meta', when(r.last.time) + loc));
      if (r.last.detail) {
        last.appendChild(document.createElement('br'));
        last.appendChild(el('span', 'meta', r.last.detail));
      }
      body.appendChild(last);
    }

    body.appendChild(el('h2', 'sec', 'Gönderi özeti'));
    var dl = el('dl');
    var row = function (k, val) {
      if (val === null || val === undefined || val === '') return;
      dl.appendChild(el('dt', null, k));
      var dd = el('dd');
      if (val instanceof Node) dd.appendChild(val); else dd.textContent = val;
      dl.appendChild(dd);
    };
    var ov = an.overview;
    row('Çıkış', ov.origin);
    row('Varış', r.shipTo);
    row('Yolda geçen süre', ov.daysInTransit === null ? null : ov.daysInTransit + ' gün');
    if (!r.delivered && r.estFrom && r.estTo) row('Tahmini teslimat', day(r.estFrom) + ' – ' + day(r.estTo));
    row('Servis', r.service);
    row('Vergi / gümrük ücreti', ov.dutyPaid === null ? null : (ov.dutyPaid ? 'Ödenmiş (DDP)' : 'Alıcıdan tahsil edilebilir'));

    if (r.localCarrier || r.localTrackingNumber) {
      var span = el('span');
      if (r.localCarrier) span.appendChild(document.createTextNode(r.localCarrier));
      var num = r.localTrackingNumber;
      var u = safeUrl(r.localCarrierUrl);
      if (num) {
        if (r.localCarrier) span.appendChild(document.createTextNode(' · '));
        if (u) {
          var a = el('a', 'mono', num);
          a.href = u; a.target = '_blank'; a.rel = 'noopener noreferrer';
          a.title = r.localCarrierPrefilled
            ? 'Carrier sayfası bu numarayla açılır'
            : 'Carrier sayfası açılır, numarayı kopyalayıp oraya yapıştır';
          span.appendChild(a);
        } else {
          span.appendChild(el('span', 'mono', num));
        }
        span.appendChild(document.createTextNode(' '));
        var cp = el('button', 'mini', 'Kopyala');
        cp.type = 'button';
        cp.addEventListener('click', async function () {
          try {
            await navigator.clipboard.writeText(num);
            cp.textContent = 'Kopyalandı';
            setTimeout(function () { cp.textContent = 'Kopyala'; }, 1500);
          } catch (e) { cp.textContent = 'Kopyalanamadı'; }
        });
        span.appendChild(cp);
        if (u && !r.localCarrierPrefilled) {
          span.appendChild(document.createElement('br'));
          span.appendChild(el('span', 'meta',
            'Bu carrier için numara linke otomatik eklenemiyor, sayfa açılınca numarayı yapıştır.'));
        }
      } else if (u) {
        span.appendChild(document.createTextNode(' · '));
        var a2 = el('a', null, 'carrier sitesinde aç');
        a2.href = u; a2.target = '_blank'; a2.rel = 'noopener noreferrer';
        span.appendChild(a2);
      }
      row('Local carrier', span);
    }
    row('APC referans no', r.ref2);
    row('Referans 1', r.ref1);
    body.appendChild(dl);

    if (r.events && r.events.length) {
      var det = el('details');
      det.appendChild(el('summary', null, 'Tüm hareketler (' + r.events.length + ')'));
      var ol = el('ol');
      r.events.forEach(function (e) {
        var li = el('li', 'ev');
        li.appendChild(el('div', null, e.description));
        li.appendChild(el('div', 't', when(e.time) + (e.location ? ' · ' + e.location : '')));
        ol.appendChild(li);
      });
      det.appendChild(ol);
      body.appendChild(det);
    }

    // Alt satır: son kontrol zamanı ve tekrar kontrol düğmesi
    if (opts.key) {
      var foot = el('div', 'foot');
      var rb = el('button', null, busy[opts.key] ? 'Kontrol ediliyor…' : 'Tekrar kontrol et');
      rb.type = 'button';
      rb.disabled = !!busy[opts.key];
      rb.addEventListener('click', function () { recheck(opts.key); });
      foot.appendChild(rb);
      if (opts.checkedAt) foot.appendChild(el('span', 'hint', 'Son kontrol: ' + when(opts.checkedAt)));
      body.appendChild(foot);
    }

    card.appendChild(body);
    return card;
  }

  // ---------- Ana alan ----------
  function clearMain() {
    view = { type: 'none', key: null, items: [] };
    $('results').replaceChildren();
    $('actions').style.display = 'none';
  }

  function refreshMain() {
    var box = $('results');
    if (view.type === 'none') return;
    box.replaceChildren();
    var frag = document.createDocumentFragment();
    if (view.type === 'entry') {
      var e = findEntry(view.key);
      if (!e) { clearMain(); return; }
      frag.appendChild(render(e.result, { key: e.key, checkedAt: e.checkedAt }));
    } else {
      view.items.forEach(function (it) {
        if (!it.r.ok) { frag.appendChild(render(it.r)); return; }
        var ent = findEntry(it.key);
        if (ent) frag.appendChild(render(ent.result, { key: ent.key, checkedAt: ent.checkedAt }));
        else frag.appendChild(render(it.r, { checkedAt: it.checkedAt }));
      });
    }
    box.appendChild(frag);
    $('actions').style.display = 'block';
  }

  function currentResults() {
    if (view.type === 'entry') {
      var e = findEntry(view.key);
      return e ? [e.result] : [];
    }
    return view.items.map(function (it) {
      var ent = it.r.ok ? findEntry(it.key) : null;
      return ent ? ent.result : it.r;
    });
  }

  function showEntry(key) {
    var e = findEntry(key);
    if (!e) return;
    e.changed = false;
    saveHistory();
    view = { type: 'entry', key: key, items: [] };
    setNotice('');
    refreshMain();
    renderHistory();
    if ($('results').scrollIntoView) $('results').scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  // ---------- Geçmiş listesi ----------
  function renderHistory() {
    var list = $('histList');
    list.replaceChildren();
    $('histEmpty').style.display = history.length ? 'none' : 'block';
    $('histCount').textContent = history.length ? history.length + ' kargo' : '';
    $('clearHist').disabled = !history.length;
    $('recheckAll').disabled = !history.length || Object.keys(busy).length > 0;
    $('histNote').textContent = storageOk ? '' : 'Tarayıcı geçmişi kaydetmeye izin vermiyor, liste sayfa kapanınca silinir.';

    // Durum sayıları
    var counts = {};
    history.forEach(function (e) { var k = verdictOf(e.result); counts[k] = (counts[k] || 0) + 1; });
    var chips = $('histStats');
    chips.replaceChildren();
    ['delayed', 'returned', 'attention', 'ontrack', 'delivered', 'unknown'].forEach(function (k) {
      if (!counts[k]) return;
      chips.appendChild(el('span', 'badge ' + VERDICTS[k][1], counts[k] + ' ' + VERDICTS[k][0].toLowerCase()));
    });

    history.forEach(function (e) {
      var r = e.result;
      var verdict = verdictOf(r);
      var li = el('li', 'h-item v-' + verdict + (view.type === 'entry' && view.key === e.key ? ' active' : ''));

      var main = el('button', 'h-main');
      main.type = 'button';
      main.title = 'Detayı göster';
      var top = el('span', 'h-top');
      top.appendChild(el('span', 'pkg', r.packageNumber || r.id));
      top.appendChild(el('span', 'badge ' + VERDICTS[verdict][1], VERDICTS[verdict][0]));
      main.appendChild(top);
      main.appendChild(el('span', 'h-line', alertText(r)));
      var bits = [];
      if (r.localCarrier) bits.push(r.localCarrier);
      if (r.last) bits.push(r.last.description);
      bits.push('Son kontrol: ' + when(e.checkedAt));
      main.appendChild(el('span', 'h-meta', bits.join(' · ')));
      main.addEventListener('click', function () { showEntry(e.key); });
      li.appendChild(main);

      var act = el('div', 'h-actions');
      var rb = el('button', 'mini', busy[e.key] ? 'Kontrol ediliyor…' : 'Tekrar kontrol et');
      rb.type = 'button';
      rb.disabled = !!busy[e.key];
      rb.addEventListener('click', function () { recheck(e.key); });
      act.appendChild(rb);
      if (e.changed) act.appendChild(el('span', 'new', 'Yeni hareket'));
      if (e.error) act.appendChild(el('span', 'h-err', e.error));
      li.appendChild(act);
      list.appendChild(li);
    });
  }

  // ---------- Özet metni ----------
  function summaryText(results) {
    return results.map(function (r) {
      if (!r.ok) return r.id + ': sorgulanamadı (' + r.error + ')';
      var an = r.analysis;
      var lines = [(r.packageNumber || r.id) + ': ' + an.headline];
      if (r.last) {
        lines.push('  Son hareket: ' + r.last.description + ' — ' + when(r.last.time) +
          (r.last.location ? ' — ' + r.last.location : ''));
      }
      if (r.localCarrier) {
        lines.push('  Local carrier: ' + r.localCarrier +
          (r.localTrackingNumber ? ' (' + r.localTrackingNumber + ')' : ''));
      }
      an.points.forEach(function (p) {
        if (p.level === 'bad' || p.level === 'warn') lines.push('  - ' + p.text);
      });
      return lines.join('\n');
    }).join('\n\n');
  }

  // ---------- Sorgulama ----------
  async function run() {
    var text = $('input').value.trim();
    if (!text) { setNotice('Önce bir link veya numara yapıştır.', true); return; }

    $('go').disabled = true;
    setNotice('Sorgulanıyor…');
    clearMain();

    try {
      var data = await lookup(text);
      var items = [];
      data.results.forEach(function (r) {
        if (r.ok) {
          var ent = addToHistory(r, data.checkedAt);
          items.push({ r: r, key: ent.key, checkedAt: data.checkedAt });
        } else {
          items.push({ r: r, key: null, checkedAt: data.checkedAt });
        }
      });
      saveHistory();
      view = { type: 'lookup', key: null, items: items };
      var parts = [data.results.length + ' kargo sorgulandı · ' + when(data.checkedAt)];
      if (data.invalid && data.invalid.length) parts.push(data.invalid.length + ' satır numara olarak tanınmadı');
      if (data.truncated) parts.push('ilk ' + data.maxIds + ' numara alındı');
      setNotice(parts.join(' · '));
      refreshMain();
      renderHistory();
    } catch (e) {
      setNotice(e instanceof TypeError ? 'Sunucuya ulaşılamadı. Uygulama çalışıyor mu?' : e.message, true);
    } finally {
      $('go').disabled = false;
    }
  }

  $('go').addEventListener('click', run);
  $('clear').addEventListener('click', function () {
    $('input').value = '';
    clearMain();
    setNotice('');
    renderHistory();
    $('input').focus();
  });
  $('input').addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') run();
  });
  $('recheckAll').addEventListener('click', recheckAll);
  $('clearHist').addEventListener('click', clearHistory);
  $('copy').addEventListener('click', async function () {
    try {
      await navigator.clipboard.writeText(summaryText(currentResults()));
      $('copy').textContent = 'Kopyalandı';
      setTimeout(function () { $('copy').textContent = 'Özeti kopyala'; }, 1500);
    } catch (e) { setNotice('Kopyalanamadı.', true); }
  });

  loadHistory();
  renderHistory();
})();
</script>
</body>
</html>
